name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test api
        run: npm run test -w api

      - name: Check api
        run: npm run check -w api

      - name: Test frontend
        run: npm run test -w frontend

      - name: Check frontend
        env:
          PUBLIC_API_URL: https://example.com
          PUBLIC_GOOGLE_CLIENT_ID: dummy.apps.googleusercontent.com
        run: npm run check -w frontend

      - name: Test infra
        run: npm run test -w infra

      - name: Synth infra
        env:
          GOOGLE_CLIENT_ID: dummy.apps.googleusercontent.com
        run: npm run infra:synth

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy CDK stack
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: npx cdk deploy --require-approval never --outputs-file /tmp/cdk-outputs.json --context googleClientId="$GOOGLE_CLIENT_ID"
        working-directory: infra

      - name: Extract stack outputs
        run: |
          echo "API_URL=$(jq -r '.HostahtmlStack.ApiUrl' /tmp/cdk-outputs.json)" >> "$GITHUB_ENV"
          echo "FRONTEND_BUCKET=$(jq -r '.HostahtmlStack.FrontendBucketName' /tmp/cdk-outputs.json)" >> "$GITHUB_ENV"
          echo "DISTRIBUTION_ID=$(jq -r '.HostahtmlStack.DistributionId' /tmp/cdk-outputs.json)" >> "$GITHUB_ENV"

      - name: Build frontend
        env:
          PUBLIC_API_URL: ${{ env.API_URL }}
          PUBLIC_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
        run: npm run build -w frontend

      - name: Sync frontend to S3
        run: aws s3 sync frontend/dist/ "s3://$FRONTEND_BUCKET/" --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$DISTRIBUTION_ID" \
            --paths "/*"
